<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Elsie&family=Open+Sans:wght@700&display=swap" rel="stylesheet">
    <title>Wedding Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <img src="Assets/colt standa.svg" class="decor colt-stanga" alt="">
    <img src="Assets/colt dreapta.svg" class="decor colt-dreapta" alt="">
    <img src="Assets/subsol.svg" class="decor subsol" alt="">

    <div class="container">
        <header>
            <nav>
                <a href="evenimente.html">EVENIMENTELE MELE</a>
                <a href="#">PARTICIPANȚI</a>
            </nav>
        </header>

        <main class="continut-principal">
            
            <div class="coloana-stanga">
                <h1>
                    <span class="mov">Wedding</span><br>
                    <span class="albastru">Planner</span>
                </h1>
                <button id="buton-creare" class="buton-primar">Creează eveniment</button>
            </div>

            <div class="coloana-dreapta">
                <div class="cerc-grafic">
                    <img src="Assets/chestie.png" class="flori-fundal" alt="Decor floral">
                    <img src="Assets/inele.svg" class="inele" alt="Inele de nuntă">
                </div>
            </div>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
