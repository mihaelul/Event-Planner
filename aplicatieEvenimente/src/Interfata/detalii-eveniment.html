<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalii Eveniment - Wedding Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Elsie&family=Open+Sans:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <img src="Assets/colt standa.svg" class="decor colt-stanga" alt="">

    <div class="container container-larg">

        <header>
            <nav>
                <a href="evenimente.html">EVENIMENTELE MELE</a>
            </nav>
        </header>

        <main class="continut-detalii">

            <div class="antet-tabel">
                <h1 class="titlu-nunta">NUNTA ALI & BABA</h1>
                <h2 class="data-nunta">20.08.2026</h2>
                <button class="buton-primar buton-participanti">Participanti</button>
            </div>
            
  
            <table class="tabel-evenimente tabel-detaliat">
                <thead>
                    <tr>
                        <th>Serviciu</th>
                        <th>Prioritate</th>
                        <th>Pret/Bucata</th>
                        <th>Cantitate</th>
                        <th>Pret Total</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="celula-alba celula-stanga">
                            <span class="icon-sterge">⊗</span> Cort Coretescu
                        </td>
                        <td>Mare</td>
                        <td class="celula-alba">-</td>
                        <td>200 oameni</td>
                        <td class="celula-alba">6000 €</td>
                    </tr>
                    <tr><td></td><td></td><td></td><td></td><td></td></tr>
                    <tr><td></td><td></td><td></td><td></td><td></td></tr>
                    <tr><td></td><td></td><td></td><td></td><td></td></tr>
                </tbody>
            </table>


            <div class="subsol-detalii">
                <div class="subsol-stanga">
                    <p class="recomandare">RECOMANDARE: Nu te mai casatori</p>
                    <div class="banner-buget">
                        BUGET: 100000 EURO
                    </div>
                </div>
                <div class="subsol-dreapta caseta-total">
                    <p>Preț Total: 67 €</p>
                    <p>Diferența buget: 69 €</p>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
